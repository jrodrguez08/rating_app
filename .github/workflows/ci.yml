name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Use Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.2
      - name: Test Firebase Auth, Firestore integration, and rules
        run: npm run test:firebase
