name: Match lifecycle trigger

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      LIFECYCLE_SYNC_URL: ${{ secrets.LIFECYCLE_SYNC_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until deployment secrets are configured
        if: env.LIFECYCLE_SYNC_URL == '' || env.CRON_SECRET == ''
        run: echo "Lifecycle endpoint is not configured; skipping safely."
      - name: Trigger match-aware lifecycle synchronization
        if: env.LIFECYCLE_SYNC_URL != '' && env.CRON_SECRET != ''
        run: >-
          curl --fail --silent --show-error
          --retry 2 --retry-all-errors
          --max-time 90
          --request POST
          --header "Authorization: Bearer ${CRON_SECRET}"
          "${LIFECYCLE_SYNC_URL}"
